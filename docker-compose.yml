services:
  construction-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: construction-prototype
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
